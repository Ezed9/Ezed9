<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="100%" height="210">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="pipeBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="pipeTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <style>
    .hdr { font: 700 13px 'SFMono-Regular', Consolas, monospace; fill: #f0f6fc; }
    .sub { font: 500 11px 'Segoe UI', sans-serif; fill: #8b949e; }
    .node-title { font: 700 11px 'SFMono-Regular', Consolas, monospace; fill: #e6edf3; text-anchor: middle; }
    .node-sub { font: 400 9.5px 'Segoe UI', sans-serif; fill: #8b949e; text-anchor: middle; }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: flowAnim 4s linear infinite;
    }
    @keyframes flowAnim {
      to { stroke-dashoffset: -48; }
    }
  </style>

  <!-- Left Panel: Webhook Delivery Engine -->
  <rect x="4" y="6" width="436" height="198" rx="12" fill="url(#panelBg)" stroke="#30363d" stroke-width="1.2" />
  <circle cx="24" cy="28" r="4" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <text x="36" y="32" class="hdr">WEBHOOK DELIVERY PLATFORM // ARCHITECTURE</text>
  <text x="24" y="50" class="sub">At-least-once semantics • PostgreSQL SKIP LOCKED • Redis Token Bucket</text>

  <!-- Connecting Pipe Left -->
  <line x1="80" y1="112" x2="365" y2="112" stroke="#21262d" stroke-width="3" />
  <line x1="80" y1="112" x2="365" y2="112" stroke="url(#pipeBlue)" stroke-width="2.5" class="flow-line" />

  <!-- Nodes Left -->
  <g transform="translate(22, 82)">
    <rect width="118" height="60" rx="8" fill="#0d1117" stroke="#38bdf8" stroke-width="1.2" />
    <text x="59" y="25" class="node-title">FastAPI Ingest</text>
    <text x="59" y="42" class="node-sub">Idempotency-Key</text>
    <text x="59" y="54" class="node-sub">+ Outbox Txn</text>
  </g>

  <g transform="translate(163, 82)">
    <rect width="118" height="60" rx="8" fill="#0d1117" stroke="#818cf8" stroke-width="1.2" />
    <text x="59" y="25" class="node-title">Worker Pool</text>
    <text x="59" y="42" class="node-sub">SKIP LOCKED</text>
    <text x="59" y="54" class="node-sub">+ Redis Limiter</text>
  </g>

  <g transform="translate(304, 82)">
    <rect width="118" height="60" rx="8" fill="#0d1117" stroke="#2dd4bf" stroke-width="1.2" />
    <text x="59" y="25" class="node-title">HMAC-SHA256</text>
    <text x="59" y="42" class="node-sub">Jitter Retries + DLQ</text>
    <text x="59" y="54" class="node-sub">315 ev/s • 5ms p95</text>
  </g>

  <text x="24" y="182" class="sub" fill="#38bdf8">⚡ Load-tested: 50 Locust clients • 100% delivery under 30% receiver failure</text>

  <!-- Right Panel: Bouncer MCP Security Proxy -->
  <rect x="460" y="6" width="436" height="198" rx="12" fill="url(#panelBg)" stroke="#30363d" stroke-width="1.2" />
  <circle cx="480" cy="28" r="4" fill="#2dd4bf">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <text x="492" y="32" class="hdr">BOUNCER: MCP SECURITY PROXY // ZERO-TRUST</text>
  <text x="480" y="50" class="sub">Deterministic Taint Tracking • Schema Pinning • Zero LLM Overhead</text>

  <!-- Connecting Pipe Right -->
  <line x1="536" y1="112" x2="820" y2="112" stroke="#21262d" stroke-width="3" />
  <line x1="536" y1="112" x2="820" y2="112" stroke="url(#pipeTeal)" stroke-width="2.5" class="flow-line" />

  <!-- Nodes Right -->
  <g transform="translate(478, 82)">
    <rect width="118" height="60" rx="8" fill="#0d1117" stroke="#2dd4bf" stroke-width="1.2" />
    <text x="59" y="25" class="node-title">AI Agent Call</text>
    <text x="59" y="42" class="node-sub">stdio MCP Stream</text>
    <text x="59" y="54" class="node-sub">Untrusted Context</text>
  </g>

  <g transform="translate(619, 82)">
    <rect width="118" height="60" rx="8" fill="#0d1117" stroke="#38bdf8" stroke-width="1.2" />
    <text x="59" y="25" class="node-title">Bouncer Engine</text>
    <text x="59" y="42" class="node-sub">Taint Tracking</text>
    <text x="59" y="54" class="node-sub">+ Schema Pinning</text>
  </g>

  <g transform="translate(760, 82)">
    <rect width="118" height="60" rx="8" fill="#0d1117" stroke="#818cf8" stroke-width="1.2" />
    <text x="59" y="25" class="node-title">Safe Tool Exec</text>
    <text x="59" y="42" class="node-sub">Budget + Path Guard</text>
    <text x="59" y="54" class="node-sub">0 Leaks / 16 Evals</text>
  </g>

  <text x="480" y="182" class="sub" fill="#2dd4bf">🛡️ Published on PyPI • Automated Trusted Publishing • 100+ CI Tests</text>
</svg>
