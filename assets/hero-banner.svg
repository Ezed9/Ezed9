<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#2dd4bf;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#2dd4bf;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2dd4bf">
        <animate attributeName="stop-color" values="#2dd4bf;#38bdf8;#818cf8;#2dd4bf" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font: 800 34px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #f0f6fc; letter-spacing: -0.5px; }
    .subtitle { font: 600 15px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #38bdf8; }
    .bio { font: 400 13.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #8b949e; }
    .badge-text { font: 600 11.5px 'SFMono-Regular', Consolas, monospace; fill: #e6edf3; }
    .metric-val { font: 700 15px 'SFMono-Regular', Consolas, monospace; fill: #38bdf8; }
    .metric-lbl { font: 500 10.5px 'Segoe UI', sans-serif; fill: #8b949e; }
    .pulse-line {
      stroke-dasharray: 8 6;
      animation: dashFlow 12s linear infinite;
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -280; }
    }
  </style>

  <!-- Background -->
  <rect width="900" height="260" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />
  <rect width="900" height="260" rx="14" fill="url(#grid)" />

  <!-- Top animated accent bar -->
  <rect x="2" y="2" width="896" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Animated background circuit trace -->
  <path d="M 620 40 L 700 40 L 730 70 L 860 70" fill="none" stroke="#1e293b" stroke-width="2" />
  <path d="M 620 40 L 700 40 L 730 70 L 860 70" fill="none" stroke="url(#accentGrad)" stroke-width="2" class="pulse-line" />
  <circle cx="620" cy="40" r="3.5" fill="#38bdf8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="860" cy="70" r="3.5" fill="#2dd4bf">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite" />
  </circle>

  <!-- Status Pill -->
  <rect x="36" y="28" width="285" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="52" cy="41" r="4.5" fill="#2dd4bf" filter="url(#glow)">
    <animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.55;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="66" y="45" class="badge-text">SYS.ONLINE // NIT SILCHAR • INDIA</text>

  <!-- Name & Headline -->
  <text x="36" y="96" class="title">Nishit Baishya</text>
  <text x="302" y="94" class="badge-text" fill="#8b949e">@Ezed9</text>
  <text x="36" y="124" class="subtitle">&gt; Backend &amp; Distributed Systems • AI Agent Security (MCP) • Full-Stack Lead</text>
  <text x="36" y="150" class="bio">Co-Founder @ Maxweb (max-web.studio) • AI Research @ NIT Silchar • B.Tech ECE '27</text>

  <!-- 4 Live Telemetry Cards -->
  <g transform="translate(36, 174)">
    <rect width="196" height="62" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="4" height="62" rx="2" fill="#38bdf8" />
    <text x="16" y="26" class="metric-val">315 events/s</text>
    <text x="16" y="46" class="metric-lbl">Webhook Engine (5ms p95)</text>
  </g>

  <g transform="translate(246, 174)">
    <rect width="196" height="62" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="4" height="62" rx="2" fill="#818cf8" />
    <text x="16" y="26" class="metric-val" fill="#818cf8">0 Data Leaks</text>
    <text x="16" y="46" class="metric-lbl">Bouncer MCP Proxy (PyPI)</text>
  </g>

  <g transform="translate(456, 174)">
    <rect width="196" height="62" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="4" height="62" rx="2" fill="#2dd4bf" />
    <text x="16" y="26" class="metric-val" fill="#2dd4bf">0.92 AUROC</text>
    <text x="16" y="46" class="metric-lbl">CLIP ViT-L/14 Deepfake Eval</text>
  </g>

  <g transform="translate(666, 174)">
    <rect width="198" height="62" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="4" height="62" rx="2" fill="#f59e0b" />
    <text x="16" y="26" class="metric-val" fill="#f59e0b">500+ Pts/Day</text>
    <text x="16" y="46" class="metric-lbl">Hospital OPD/IPD Platform</text>
  </g>
</svg>
